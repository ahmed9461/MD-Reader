plugins {
    id 'com.android.application'
}


def releaseStorePath = System.getenv('MD_READER_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('MD_READER_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MD_READER_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MD_READER_KEY_PASSWORD')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }

android {
    namespace 'app.mdreader.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'app.mdreader.mobile'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '0.8.0'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Direct APKs are ABI-specific to avoid shipping every ML Kit native library
    // to one phone. App Bundles still let Google Play deliver device-specific APKs.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
}
