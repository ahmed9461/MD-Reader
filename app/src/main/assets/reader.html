<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="css/highlight-github.css">
<style>
:root{
  --bg:#fff;--text:#1f2328;--secondary:#656d76;--link:#0969da;--border:#d0d7de;
  --code:#f6f8fa;--quote:#d0d7de;--row:#f6f8fa;--font-size:17px;
  --success:#1a7f37;--success-border:#2da44e;--success-bg:rgba(46,160,67,.12);
  --task-empty:#8c959f;
}
[data-theme="dark"]{
  color-scheme:dark;--bg:#0d1117;--text:#e6edf3;--secondary:#8b949e;--link:#58a6ff;
  --border:#30363d;--code:#161b22;--quote:#30363d;--row:#161b22;
  --success:#3fb950;--success-border:#3fb950;--success-bg:rgba(46,160,67,.18);
  --task-empty:#6e7681;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:var(--font-size);line-height:1.72;-webkit-text-size-adjust:100%}
#content{max-width:860px;margin:0 auto;padding:20px 18px 44px;overflow-wrap:anywhere}
#content>:first-child{margin-top:0}
h1,h2,h3,h4,h5,h6{line-height:1.3;margin:1.45em 0 .55em;font-weight:700;text-align:start}
h1{font-size:2em;border-bottom:1px solid var(--border);padding-bottom:.3em}
h2{font-size:1.5em;border-bottom:1px solid var(--border);padding-bottom:.3em}
h3{font-size:1.25em} h4{font-size:1.08em} h5{font-size:.95em} h6{font-size:.9em;color:var(--secondary)}
p{margin:.8em 0 1em;text-align:start}
a{color:var(--link);text-decoration:none} a:active{text-decoration:underline}
blockquote{margin:1em 0;padding:.35em 1em;border-inline-start:4px solid var(--quote);color:var(--secondary);text-align:start}
ul,ol{padding-inline-start:2em;margin:.7em 0 1em} li{margin:.28em 0;text-align:start}
hr{height:1px;border:0;background:var(--border);margin:1.8em 0}
code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;background:var(--code);border-radius:5px;padding:.14em .34em}
.code-shell{position:relative;margin:1em 0}
pre{margin:0;overflow:auto;background:var(--code);border:1px solid var(--border);border-radius:9px;padding:14px;-webkit-overflow-scrolling:touch}
pre code{padding:0;background:transparent;border-radius:0;white-space:pre;overflow-wrap:normal;direction:inherit;text-align:inherit}
.copy-code{position:absolute;top:8px;right:8px;border:1px solid var(--border);background:var(--bg);color:var(--secondary);border-radius:7px;padding:5px 8px;font-size:12px;z-index:2}
.code-shell[dir="rtl"] .copy-code{right:auto;left:8px}
.table-wrap{width:100%;overflow-x:auto;margin:1em 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;min-width:100%;width:max-content;max-width:none}
th,td{border:1px solid var(--border);padding:8px 12px;text-align:start;vertical-align:top;white-space:normal}
th{background:var(--code);font-weight:700} tr:nth-child(even){background:var(--row)}
img{max-width:100%;height:auto;border-radius:8px}
mark{background:#fff8c5;color:inherit;padding:.05em .18em;border-radius:4px}
[data-theme="dark"] mark{background:#5b4a12;color:inherit}
kbd{display:inline-block;padding:.08em .42em;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:var(--code);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em}
details{border:1px solid var(--border);border-radius:9px;padding:.55em .75em;margin:.8em 0;background:var(--code)}
summary{cursor:pointer;font-weight:700}
.front-matter{border:1px solid var(--border);border-radius:9px;overflow:hidden;margin:0 0 1.3em}
.front-matter table{width:100%;min-width:0}.front-matter td:first-child{font-weight:700;white-space:nowrap;width:1%}

/* Task lists are rendered by MD Reader itself so checked state is always visible,
   including on Android WebView versions that gray out disabled native checkboxes. */
li.task-item{list-style:none;position:relative;margin:.34em 0;padding:.18em .35em;border-radius:8px}
li.task-item::marker{content:""}
.task-box{display:inline-flex;width:1.2em;height:1.2em;margin-inline-end:.55em;vertical-align:-.16em;align-items:center;justify-content:center;border:2px solid var(--task-empty);border-radius:4px;font-size:.86em;font-weight:900;line-height:1;color:transparent;background:transparent;user-select:none}
.task-item.task-checked{background:var(--success-bg);font-weight:700;color:var(--success);border-inline-start:4px solid var(--success-border)}
.task-item.task-checked .task-box{border-color:var(--success-border);background:var(--success-border);color:#fff}
.correct-answer{background:var(--success-bg);color:var(--success);font-weight:700;border-inline-start:4px solid var(--success-border);border-radius:8px;padding:.28em .55em}
.task-item.correct-answer{padding:.18em .35em}

.mermaid{margin:1.2em 0;text-align:center;overflow:auto}
.mermaid-error{border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--secondary)}
.search-current{outline:2px solid #f59e0b}
.empty{color:var(--secondary);text-align:center;margin-top:28vh}

/* On large documents, Chromium can skip painting off-screen top-level blocks while
   preserving layout. This substantially reduces initial preview work. */
#content.large-document>.md-virtual-block{content-visibility:auto;contain-intrinsic-size:auto 96px}

/* True mixed-direction rendering: each semantic block gets dir=auto in JS. */
[dir="rtl"]{text-align:right}
[dir="ltr"]{text-align:left}
pre[dir="ltr"],code[dir="ltr"]{direction:ltr;text-align:left;unicode-bidi:plaintext}
pre[dir="rtl"],code[dir="rtl"]{direction:rtl;text-align:right;unicode-bidi:plaintext}
</style>
<script src="js/markdown-it.min.js"></script>
<script src="js/highlight.min.js"></script>
<script src="js/purify.min.js"></script>
<script src="js/mdreader-safe-html.js"></script>
</head>
<body data-theme="light"><main id="content"><div class="empty">افتح ملف Markdown للبدء</div></main>
<script>
(function(){
  const content = document.getElementById('content');
  const LARGE_DOCUMENT_CHARS = 180000;
  let currentTheme = 'light';
  let mermaidLoadPromise = null;
  let codeObserver = null;
  let mermaidObserver = null;
  let renderGeneration = 0;
  let chunkedMarkdown = null;

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  const md = window.markdownit({
    html:true,
    linkify:true,
    typographer:true,
    breaks:true,
    highlight:function(str,lang){
      if(lang && lang.toLowerCase()==='mermaid') return esc(str);
      // Highlighting is intentionally deferred until the code block is visible.
      // Returning escaped source here avoids doing the same expensive work twice.
      return esc(str);
    }
  });

  function normalizeTaskSyntax(source){
    // Accept standard Markdown task syntax and common human variants:
    // - [x], -[x], - [ x ], * [X], + [ ]
    // The source file is not modified; normalization only affects preview rendering.
    return String(source||'').replace(/^([\t ]*)[-+*][\t ]*\[[\t ]*([xX]?)[\t ]*\][\t ]*/gm,
      function(_,indent,state){return indent+'- ['+(state?'x':' ')+'] ';});
  }

  function frontMatter(source){
    if(!source.startsWith('---\n') && !source.startsWith('---\r\n')) return {source,html:''};
    const lines=source.replace(/\r\n/g,'\n').split('\n');
    let end=-1;
    for(let i=1;i<lines.length;i++){if(lines[i].trim()==='---'){end=i;break;}}
    if(end<0) return {source,html:''};
    const rows=[];
    for(let i=1;i<end;i++){
      const m=lines[i].match(/^([^:#][^:]*):\s*(.*)$/);
      if(m) rows.push('<tr><td dir="auto">'+esc(m[1].trim())+'</td><td dir="auto">'+esc(m[2].trim())+'</td></tr>');
    }
    const html=rows.length?'<div class="front-matter"><table><tbody>'+rows.join('')+'</tbody></table></div>':'';
    return {source:lines.slice(end+1).join('\n'),html};
  }

  const ltrCodeLanguages=new Set(['bash','sh','shell','zsh','powershell','ps1','cmd','bat','json','yaml','yml','xml','html','css','javascript','js','typescript','ts','java','kotlin','python','py','dart','go','rust','c','cpp','csharp','cs','sql','php','ruby','swift','ini','toml']);

  function firstStrongDirection(text){
    const value=String(text||'');
    for(const ch of value){
      const cp=ch.codePointAt(0);
      if((cp>=0x0590&&cp<=0x08ff)||(cp>=0xfb1d&&cp<=0xfdff)||(cp>=0xfe70&&cp<=0xfefc))return 'rtl';
      if(/[A-Za-z]/.test(ch))return 'ltr';
    }
    return 'ltr';
  }

  function languageOfCode(code){
    for(const cls of Array.from(code.classList||[])){
      if(cls.startsWith('language-'))return cls.slice(9).toLowerCase();
      if(cls.startsWith('lang-'))return cls.slice(5).toLowerCase();
    }
    return '';
  }

  function applyCodeDirections(){
    content.querySelectorAll('pre').forEach(pre=>{
      const code=pre.querySelector(':scope > code');
      const lang=code?languageOfCode(code):'';
      const natural=firstStrongDirection(pre.textContent);
      const dir=natural==='rtl'?'rtl':((lang&&ltrCodeLanguages.has(lang))?'ltr':natural);
      pre.setAttribute('dir',dir);
      if(code)code.setAttribute('dir',dir);
      const shell=pre.closest('.code-shell');if(shell)shell.setAttribute('dir',dir);
    });
    content.querySelectorAll('code:not(pre code)').forEach(code=>code.setAttribute('dir',firstStrongDirection(code.textContent)));
  }

  function applyDirections(){
    content.querySelectorAll('table,ul,ol').forEach(el=>el.setAttribute('dir','auto'));
    content.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,blockquote,th,td,figcaption,dd,dt').forEach(el=>el.setAttribute('dir','auto'));
    applyCodeDirections();
  }

  function enhanceTables(){
    content.querySelectorAll('table').forEach(t=>{
      if(t.closest('.front-matter') || (t.parentElement&&t.parentElement.classList.contains('table-wrap'))) return;
      const w=document.createElement('div');w.className='table-wrap';t.parentNode.insertBefore(w,t);w.appendChild(t);
    });
  }

  function makeTaskBox(checked){
    const box=document.createElement('span');
    box.className='task-box';
    box.setAttribute('role','checkbox');
    box.setAttribute('aria-checked',checked?'true':'false');
    box.setAttribute('aria-disabled','true');
    box.textContent=checked?'✓':'';
    return box;
  }

  function enhanceTasks(){
    content.querySelectorAll('li').forEach(li=>{
      const html=li.innerHTML;
      const m=html.match(/^\s*\[([ xX])\]\s*/);
      if(!m)return;
      const checked=m[1].toLowerCase()==='x';
      li.classList.add('task-item');
      if(checked){li.classList.add('task-checked','correct-answer');}
      li.innerHTML=html.replace(/^\s*\[[ xX]\]\s*/,'');
      li.insertBefore(makeTaskBox(checked),li.firstChild);
    });
  }

  function enhanceCorrectAnswers(){
    // Existing quiz banks often use a literal ✅ instead of task-list syntax.
    // Keep the emoji intact but give the whole answer the same semantic highlight.
    content.querySelectorAll('p,li').forEach(el=>{
      if(el.classList.contains('task-checked'))return;
      const text=(el.textContent||'').trim();
      if(text.startsWith('✅'))el.classList.add('correct-answer');
    });
  }

  function enhanceCode(){
    content.querySelectorAll('pre').forEach(pre=>{
      const code=pre.querySelector(':scope > code');
      if(code&&languageOfCode(code)==='mermaid')return;
      if(pre.closest('.code-shell'))return;
      const shell=document.createElement('div');shell.className='code-shell';shell.setAttribute('dir',pre.getAttribute('dir')||firstStrongDirection(pre.textContent));pre.parentNode.insertBefore(shell,pre);shell.appendChild(pre);
      const b=document.createElement('button');b.className='copy-code';b.type='button';b.textContent='نسخ';
      b.onclick=()=>{const value=pre.textContent||''; if(window.Android&&Android.copyText)Android.copyText(value); b.textContent='تم';setTimeout(()=>b.textContent='نسخ',900);};
      shell.appendChild(b);
    });
  }

  function assignHeadings(){
    let i=0;content.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{h.dataset.headingIndex=String(i);h.id='md-heading-'+i;i++;});
  }

  function enableLargeDocumentPainting(large){
    content.classList.toggle('large-document',large);
    content.querySelectorAll(':scope > *').forEach(el=>el.classList.toggle('md-virtual-block',large));
  }

  function cleanupDeferredWork(){
    if(codeObserver){codeObserver.disconnect();codeObserver=null;}
    if(mermaidObserver){mermaidObserver.disconnect();mermaidObserver=null;}
  }

  function highlightOne(code){
    if(!window.hljs||!code||code.classList.contains('hljs')||languageOfCode(code)==='mermaid')return;
    try{hljs.highlightElement(code);}catch(_){ }
  }

  function setupCodeHighlighting(large){
    const nodes=Array.from(content.querySelectorAll('pre code:not(.language-mermaid)'));
    if(!nodes.length||!window.hljs)return;
    if(!large||!('IntersectionObserver' in window)){nodes.forEach(highlightOne);return;}
    codeObserver=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{if(entry.isIntersecting){highlightOne(entry.target);codeObserver.unobserve(entry.target);}});
    },{root:null,rootMargin:'700px 0px'});
    nodes.forEach(node=>codeObserver.observe(node));
  }

  function ensureMermaid(){
    if(window.mermaid)return Promise.resolve(window.mermaid);
    if(mermaidLoadPromise)return mermaidLoadPromise;
    mermaidLoadPromise=new Promise((resolve,reject)=>{
      const script=document.createElement('script');script.src='js/mermaid.min.js';
      script.onload=()=>resolve(window.mermaid);script.onerror=reject;document.head.appendChild(script);
    });
    return mermaidLoadPromise;
  }

  async function renderMermaidPre(pre,generation){
    if(!pre||!pre.isConnected||generation!==renderGeneration)return;
    const code=pre.querySelector(':scope > code.language-mermaid');
    if(!code)return;
    const src=code.textContent||'';
    const div=document.createElement('div');div.className='mermaid';div.textContent=src;
    pre.replaceWith(div);
    try{
      await ensureMermaid();
      if(generation!==renderGeneration||!div.isConnected)return;
      mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:currentTheme==='dark'?'dark':'default'});
      await mermaid.run({nodes:[div]});
    }catch(e){
      if(!div.querySelector('svg')){div.className='mermaid-error';div.innerHTML='<div>تعذر رسم Mermaid</div><pre dir="ltr"><code>'+esc(src)+'</code></pre>';}
    }
  }

  async function setupMermaid(large,generation){
    const pres=Array.from(content.querySelectorAll('pre')).filter(pre=>{const code=pre.querySelector(':scope > code');return code&&languageOfCode(code)==='mermaid';});
    if(!pres.length)return;
    if(!large||!('IntersectionObserver' in window)){
      for(const pre of pres){if(generation!==renderGeneration)return;await renderMermaidPre(pre,generation);}
      return;
    }
    mermaidObserver=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{if(entry.isIntersecting){mermaidObserver.unobserve(entry.target);renderMermaidPre(entry.target,generation);}});
    },{root:null,rootMargin:'900px 0px'});
    pres.forEach(pre=>mermaidObserver.observe(pre));
  }

  function decodeBase64Utf8(encoded){
    try{
      const bin=atob(encoded);const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }catch(e){return '';}
  }

  window.beginChunkedMarkdown = function(theme,fontSize){
    chunkedMarkdown={theme:theme||'light',fontSize:fontSize||17,parts:[]};
  };

  window.appendMarkdownChunk = function(encodedPart){
    if(!chunkedMarkdown)return;
    chunkedMarkdown.parts.push(String(encodedPart||''));
  };

  window.finishChunkedMarkdown = function(){
    const pending=chunkedMarkdown;
    chunkedMarkdown=null;
    if(!pending)return;
    const encoded=pending.parts.join('');
    pending.parts.length=0;
    window.renderMarkdown(encoded,pending.theme,pending.fontSize);
  };

  window.renderMarkdown = async function(encoded,theme,fontSize){
    const generation=++renderGeneration;
    cleanupDeferredWork();
    currentTheme=theme||'light';document.body.dataset.theme=currentTheme;document.documentElement.dataset.theme=currentTheme;
    document.documentElement.style.setProperty('--font-size',(fontSize||17)+'px');

    let source=normalizeTaskSyntax(decodeBase64Utf8(encoded));
    const large=source.length>=LARGE_DOCUMENT_CHARS;
    const fm=frontMatter(source);
    source='';

    // One HTML assignment, one direction pass, and deferred expensive renderers.
    // This avoids the former double DOM walk/highlight cost on large files.
    const rawHtml=fm.html+md.render(fm.source);
    const safeHtml=(window.MDReaderSafeHtml&&typeof window.MDReaderSafeHtml.sanitize==='function')?window.MDReaderSafeHtml.sanitize(rawHtml):esc(rawHtml);
    content.innerHTML=safeHtml;
    if(generation!==renderGeneration)return;
    if(!content.innerHTML.trim()){content.innerHTML='<div class="empty">الملف فارغ</div>';return;}

    enhanceTasks();
    enhanceCorrectAnswers();
    enhanceTables();
    assignHeadings();
    enableLargeDocumentPainting(large);
    enhanceCode();
    applyDirections();
    setupCodeHighlighting(large);
    await setupMermaid(large,generation);
  };

  window.scrollToHeading=function(index){const h=content.querySelector('[data-heading-index="'+index+'"]');if(h)h.scrollIntoView({behavior:'smooth',block:'start'});};

  document.addEventListener('click',function(e){
    const a=e.target.closest('a');if(!a)return;const href=a.getAttribute('href')||'';
    if(href.startsWith('#'))return;
    e.preventDefault();if(window.Android&&Android.openLink)Android.openLink(a.href);
  });
})();
</script>
</body>
</html>
