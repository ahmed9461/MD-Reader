name: One-time v0.10 source sync

on:
  push:
    branches:
      - feature/task-answer-highlights-performance

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/task-answer-highlights-performance

      - name: Apply source migration
        run: python3 tools/source_sync_v010.py

      - name: Commit direct source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/app/mdreader/mobile/MainActivity.java; then
            echo 'No source migration needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/mdreader/mobile/MainActivity.java
          git commit -m 'Integrate v0.10 editor task tools and preview transport'
          git push origin HEAD:feature/task-answer-highlights-performance
