name: One-time reviewed UI source import
on:
  push:
    branches: ['feature/ui-ux-refresh']
    paths: ['.github/workflows/ui-source-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact review payload and write direct source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, shutil, subprocess
          from pathlib import Path
          base='fbe81f75086c6fbdb939683474557d6f105eb45d'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base
          digest=lambda b: hashlib.sha256(b).hexdigest()
          parts=sorted(Path('.ui-review').glob('part-*.b64'))
          assert len(parts)==5
          packed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert digest(packed)=='38140dd12c261f20e7f58b488238e01fe9d0f356a3eb18c4105002da4d4f1708'
          payload=json.loads(lzma.decompress(packed))
          assert payload['base']==base
          prepared=[]
          for item in payload['files']:
              p=Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in ('app','tools','plans','.github')
              if p.parts[0]=='.github':
                  assert str(p) in ('.github/workflows/build-apk.yml','.github/workflows/ui-regression.yml','.github/workflows/ui-source-snapshot.yml')
              before=p.read_bytes() if p.is_file() else None
              assert (digest(before) if before is not None else None)==item['before'], str(p)
              if item.get('delete'):
                  prepared.append((p,None));continue
              if 'binary' in item:
                  after=base64.b64decode(item['binary'],validate=True)
              else:
                  lines=(before or b'').decode('utf-8').splitlines(keepends=True)
                  after=''.join(part if isinstance(part,str) else ''.join(lines[part[0]:part[1]]) for part in item['parts']).encode('utf-8')
              assert digest(after)==item['after'], str(p)
              prepared.append((p,after))
          for p,after in prepared:
              if after is None:p.unlink()
              else:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(after)
          shutil.rmtree('.ui-review')
          Path('.github/workflows/ui-source-import.yml').unlink()
          print('Verified and imported',len(prepared),'source paths; temporary transport removed.')
          PY
          git diff --check
          python3 tools/ui-contract-check.py
      - name: Commit clean review candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign UI: inline find/replace, responsive sheets, library tabs and .md identity'
          git push origin HEAD:feature/ui-ux-refresh
          git archive --format=zip HEAD -o /tmp/ui-clean-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ui-clean-source
          path: /tmp/ui-clean-source.zip
          retention-days: 1
