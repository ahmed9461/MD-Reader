name: Android UI regression
on:
  push:
    branches: [main, 'feature/**']
    paths: ['app/**', 'tools/**', '.github/workflows/ui-regression.yml', 'PROJECT_MEMORY.md', 'PROGRESS_LOG.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true
      - name: Prepare Android SDK and renderer
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/fetch-vendor-assets.sh
      - name: Compile app and device-only test runner
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check real layouts, IME, navigation and replacement on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 360x780
            adb shell wm density 160
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p ui-results
            adb shell am instrument -w app.mdreader.mobile.test/app.mdreader.mobile.UiRegressionInstrumentation | tee ui-results/instrumentation.txt
            adb logcat -d > ui-results/logcat.txt
            adb pull /sdcard/Android/data/app.mdreader.mobile/files/ui-screenshots ui-results/
            grep -q 'UI_REGRESSION_PASS' ui-results/instrumentation.txt
      - name: Keep device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reader-ui-${{ github.sha }}
          path: ui-results/
          retention-days: 7
          if-no-files-found: warn
