name: UI review source snapshot
on:
  push:
    branches: ['feature/ui-ux-refresh']
    paths: ['.github/workflows/ui-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip HEAD -o /tmp/ui-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ui-source-${{ github.sha }}
          path: /tmp/ui-source.zip
          retention-days: 1
