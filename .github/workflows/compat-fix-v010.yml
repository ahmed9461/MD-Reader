name: One-time v0.10 Android compatibility fix

on:
  push:
    branches:
      - feature/task-answer-highlights-performance

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task-answer-highlights-performance

      - name: Replace Java 11 String helpers in Android runtime code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/app/mdreader/mobile/MainActivity.java')
          s=p.read_text()
          marker='    private int taskMarkerState(String body){\n'
          helper='''    private String trimLeadingCompat(String value){\n        if(value==null)return "";\n        int p=0;\n        while(p<value.length()&&Character.isWhitespace(value.charAt(p)))p++;\n        return p==0?value:value.substring(p);\n    }\n\n'''
          if 'private String trimLeadingCompat(String value)' not in s:
              if marker not in s: raise SystemExit('task marker method not found')
              s=s.replace(marker,helper+marker,1)
          s=s.replace('String value=body.stripLeading();','String value=trimLeadingCompat(body);')
          s=s.replace('return value.substring("✅".length()).stripLeading();','return trimLeadingCompat(value.substring("✅".length()));')
          s=s.replace('return close<0?value:value.substring(close+1).stripLeading();','return close<0?value:trimLeadingCompat(value.substring(close+1));')
          s=s.replace('if(clean.isBlank())return line;','if(clean.trim().isEmpty())return line;')
          if '.stripLeading()' in s or '.isBlank()' in s:
              raise SystemExit('Unsupported Java 11 String helper remains in MainActivity')
          p.write_text(s)
          PY

      - name: Commit direct source and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/compat-fix-v010.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/mdreader/mobile/MainActivity.java
          git commit -m 'Keep v0.10 task tools compatible with minSdk 26'
          git push origin HEAD:feature/task-answer-highlights-performance
