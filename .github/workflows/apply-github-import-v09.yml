          memory=Path('PROJECT_MEMORY.md')
          m=memory.read_text()
          marker='''\n## v0.9.0 — GitHub Markdown import (in development)\n- Branch: `github-import-v0.9`.\n- Adds direct import of public Markdown files from GitHub by pasting a `github.com/.../blob/.../*.md` or `raw.githubusercontent.com/.../*.md` URL.\n- Home screen and overflow menu expose `تنزيل من GitHub`.\n- User can either download/open in MD Reader or download then save to device with Android's document picker.\n- Network fetch is HTTPS-only, follows only GitHub/raw GitHub redirects, uses timeouts, and does not send credentials. Private repositories are intentionally not supported in this version.\n- URL parsing has pure-Java smoke coverage including the example `https://github.com/ahmed9461/GitDock/blob/main/CHANGELOG.md`.\n'''
          if '## v0.9.0 — GitHub Markdown import' not in m:
              m += marker
          memory.write_text(m)
