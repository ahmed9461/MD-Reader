          w=w.replace("          grep -q \"versionName '0.8.1'\" app/build.gradle\n          grep -q \"versionCode 11\" app/build.gradle\n", "          grep -q \"versionName '0.9.0'\" app/build.gradle\n          grep -q \"versionCode 12\" app/build.gradle\n          grep -q 'githubImportDialog' app/src/main/java/app/mdreader/mobile/MainActivity.java\n          grep -q 'GitHubMarkdownSource.download' app/src/main/java/app/mdreader/mobile/MainActivity.java\n")
          w=w.replace("            app/src/main/java/app/mdreader/mobile/SearchReplaceEngine.java \\\n            tools/TransformSmokeTest.java \\", "            app/src/main/java/app/mdreader/mobile/SearchReplaceEngine.java \\\n            app/src/main/java/app/mdreader/mobile/GitHubMarkdownSource.java \\\n            tools/TransformSmokeTest.java \\")
          w=w.replace("            tools/SearchReplaceSmokeTest.java\n", "            tools/SearchReplaceSmokeTest.java \\\n            tools/GitHubMarkdownSourceSmokeTest.java\n")
