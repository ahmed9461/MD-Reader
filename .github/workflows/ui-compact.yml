name: One-time reviewed compact editor fix
on:
  push:
    branches: ['feature/ui-ux-refresh']
    paths: ['.github/workflows/ui-compact.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Extend short-screen protection to ordinary editing
        run: |
          echo '641690650e93939227509a6d79b01c62f3ccb16d5a68948577fbe0afb1e8e04f  app/src/main/java/app/mdreader/mobile/MainActivity.java' | sha256sum -c
          echo 'a00f8b129615f80039965381e7409cad8aac7fcee37510cbc1c885c31865e4f8  app/src/androidTest/java/app/mdreader/mobile/UiRegressionInstrumentation.java' | sha256sum -c
          git apply --check .ui-compact.patch
          git apply .ui-compact.patch
          echo '4495b3bf9d6a6379cfc44645372a67df4cd6739dc3d3380fecb01052a312dd48  app/src/main/java/app/mdreader/mobile/MainActivity.java' | sha256sum -c
          echo 'c8b89d8af1be84e330b67117a722834119b6a0a99ddc242cb335ad6cc61bf9ca  app/src/androidTest/java/app/mdreader/mobile/UiRegressionInstrumentation.java' | sha256sum -c
          rm .ui-compact.patch
          git diff --check
          python3 tools/ui-contract-check.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app .ui-compact.patch
          git commit -m 'Protect ordinary editor viewport with landscape IME and add device regression'
          git push origin HEAD:feature/ui-ux-refresh
