name: Build MD Reader v0.12.0 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'docs/**'
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
      - 'PROJECT_MEMORY.md'
      - 'PROGRESS_LOG.md'

permissions:
  contents: read
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout normalized source
        uses: actions/checkout@v4

      - name: Assert direct-source architecture and v0.12 features
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/app/mdreader/mobile/MainActivity.java
          test -s app/src/main/java/app/mdreader/mobile/SearchReplaceEngine.java
          test -s app/src/main/java/app/mdreader/mobile/FlingEditText.java
          test -s app/src/main/java/app/mdreader/mobile/GitHubMarkdownSource.java
          test -s app/src/main/java/app/mdreader/mobile/SafeHtmlEditorTools.java
          test -s app/src/main/assets/js/mdreader-safe-html.js
          test -s app/src/main/assets/js/mdreader-code-fence.js
          test -s app/src/main/res/drawable-nodpi/ic_launcher_art.webp
          ! test -e tools/one_time_v011_integrate.py
          ! test -e .github/workflows/one-time-v011-safe-html.yml
          ! grep -q 'apply_editor_ux_v07.py' .github/workflows/build-apk.yml
          ! grep -q 'v0.5-mainactivity.patch' .github/workflows/build-apk.yml
          ! grep -q 'AdjustableScroller' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q "versionName '0.12.0'" app/build.gradle
          grep -q "versionCode 15" app/build.gradle
          grep -q 'new FlingEditText(this)' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'setFlingSpeedPercent' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'boolean scrollable=aa!=null&&aa.length>7' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'SOFT_INPUT_ADJUST_RESIZE' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'searchReplaceDialog' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'PREF_EDITOR_SCROLL' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'githubImportDialog' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'GitHubMarkdownSource.download' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'setTaskState(boolean checked)' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'normalizeTaskMarkers' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'PREVIEW_CHUNK_CHARS=90000' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'LARGE_EDITOR_DEBOUNCE_CHARS=120000' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'previewIo=Executors.newSingleThreadExecutor' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'safeHtmlTools' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'customHtmlColor' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'MD Reader 0.12.0' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'html:true' app/src/main/assets/reader.html
          grep -q 'MDReaderSafeHtml.sanitize' app/src/main/assets/reader.html
          grep -q 'MDReaderCodeFence.parseInfo' app/src/main/assets/reader.html
          grep -q 'code-header' app/src/main/assets/reader.html
          grep -q 'titledCodeBlockTool' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q '▣ حاوية بعنوان…' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'titledFencedCode' app/src/main/java/app/mdreader/mobile/MarkdownTransforms.java
          grep -q 'Content-Security-Policy' app/src/main/assets/reader.html
          grep -q 'dompurify@3.2.6' tools/fetch-vendor-assets.sh
          grep -q 'normalizeTaskSyntax' app/src/main/assets/reader.html
          grep -q 'task-checked' app/src/main/assets/reader.html
          grep -q 'LARGE_DOCUMENT_CHARS = 180000' app/src/main/assets/reader.html
          grep -q 'IntersectionObserver' app/src/main/assets/reader.html
          grep -q 'content-visibility:auto' app/src/main/assets/reader.html
          grep -q 'window.beginChunkedMarkdown' app/src/main/assets/reader.html
          grep -q 'android:windowSoftInputMode="adjustResize"' app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      - name: Set up Gradle without persistent Actions cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Fetch pinned renderer assets
        run: bash tools/fetch-vendor-assets.sh

      - name: Run pure Java smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/smoke
          javac -d build/smoke \
            app/src/main/java/app/mdreader/mobile/MarkdownTransforms.java \
            app/src/main/java/app/mdreader/mobile/OutlineParser.java \
            app/src/main/java/app/mdreader/mobile/MarkdownTranslationPlan.java \
            app/src/main/java/app/mdreader/mobile/MarkdownSpeechPlan.java \
            app/src/main/java/app/mdreader/mobile/SearchReplaceEngine.java \
            app/src/main/java/app/mdreader/mobile/GitHubMarkdownSource.java \
            app/src/main/java/app/mdreader/mobile/SafeHtmlEditorTools.java \
            tools/TransformSmokeTest.java \
            tools/TranslationPlanSmokeTest.java \
            tools/SpeechPlanSmokeTest.java \
            tools/SearchReplaceSmokeTest.java \
            tools/GitHubMarkdownSourceSmokeTest.java \
            tools/SafeHtmlEditorToolsSmokeTest.java
          java -cp build/smoke TransformSmokeTest
          java -cp build/smoke app.mdreader.mobile.TranslationPlanSmokeTest
          java -cp build/smoke app.mdreader.mobile.SpeechPlanSmokeTest
          java -cp build/smoke app.mdreader.mobile.SearchReplaceSmokeTest
          java -cp build/smoke app.mdreader.mobile.GitHubMarkdownSourceSmokeTest
          java -cp build/smoke app.mdreader.mobile.SafeHtmlEditorToolsSmokeTest

      - name: Check reader JavaScript syntax and HTML policy
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/js/purify.min.js
          node --check app/src/main/assets/js/mdreader-safe-html.js
          node --check app/src/main/assets/js/mdreader-code-fence.js
          node tools/code-fence-meta-smoke-test.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/assets/reader.html').read_text()
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/reader-inline.js').write_text(s[start:end])
          PY
          node --check /tmp/reader-inline.js

      - name: Check task, safe HTML, and large-document compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/reader.html').read_text()
          java = Path('app/src/main/java/app/mdreader/mobile/MainActivity.java').read_text()
          safe = Path('app/src/main/assets/js/mdreader-safe-html.js').read_text()
          assert 'normalizeTaskSyntax' in html
          assert '- [x], -[x], - [ x ]' in html
          assert "startsWith('✅')" in html
          assert 'task-checked' in html and 'correct-answer' in html
          assert 'const LARGE_DOCUMENT_CHARS = 180000' in html
          assert 'content-visibility:auto' in html
          assert 'IntersectionObserver' in html
          assert 'window.beginChunkedMarkdown' in html
          assert 'window.appendMarkdownChunk' in html
          assert 'window.finishChunkedMarkdown' in html
          assert 'setTaskState(boolean checked)' in java
          assert 'normalizeTaskMarkers' in java
          assert 'PREVIEW_CHUNK_CHARS=90000' in java
          assert 'LARGE_EDITOR_DEBOUNCE_CHARS=120000' in java
          assert 'main.postDelayed(editorMaintenancePending,220)' in java
          assert 'previewIo.execute' in java
          assert 'safeHtmlTools' in java and 'customHtmlColor' in java
          assert 'html:true' in html
          assert 'MDReaderSafeHtml.sanitize(rawHtml)' in html
          assert 'Content-Security-Policy' in html
          assert 'ALLOWED_TAGS' in safe and 'ALLOWED_ATTR' in safe and 'FORBID_TAGS' in safe
          for tag in ('script','iframe','object','embed','form','svg','math','video','audio'):
              assert "'" + tag + "'" in safe
          assert 'sanitizeStyle' in safe
          assert r'url\s*\(' in safe
          assert r'expression\s*\(' in safe
          assert r'javascript\s*:' in safe
          assert 'DOMPurify.sanitize' in safe
          assert 'ALLOW_UNKNOWN_PROTOCOLS:false' in safe
          print('Task, safe HTML, and large-document compatibility assertions passed.')
          PY

      - name: Build optimized ARM64 release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gradle --no-daemon :app:assembleRelease -PmdReaderDirectArm64=true
          ARM64_APK=$(find app/build/outputs/apk/release -type f -name '*arm64*v8a*release*.apk' | head -n1)
          if [ -z "$ARM64_APK" ]; then
            echo 'ARM64 release APK was not generated.' >&2
            find app/build/outputs/apk -type f -print || true
            exit 1
          fi
          cp "$ARM64_APK" dist/MD-Reader-v0.12.0-arm64-release-unsigned.apk

      - name: Build optimized App Bundle separately
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean
          gradle --no-daemon :app:bundleRelease
          AAB=$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n1)
          if [ -z "$AAB" ]; then
            echo 'Release App Bundle was not generated.' >&2
            find app/build/outputs/bundle -type f -print || true
            exit 1
          fi
          cp "$AAB" dist/MD-Reader-v0.12.0-release-unsigned.aab

      - name: Verify optimized outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/MD-Reader-v0.12.0-arm64-release-unsigned.apk
          test -s dist/MD-Reader-v0.12.0-release-unsigned.aab
          unzip -l dist/MD-Reader-v0.12.0-arm64-release-unsigned.apk > /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libtranslate_jni.so' /tmp/apk-list.txt
          ! grep -q 'lib/x86_64/libtranslate_jni.so' /tmp/apk-list.txt
          ! grep -q 'lib/x86/libtranslate_jni.so' /tmp/apk-list.txt
          ! grep -q 'lib/armeabi-v7a/libtranslate_jni.so' /tmp/apk-list.txt
          grep -q 'assets/js/purify.min.js' /tmp/apk-list.txt
          grep -q 'assets/js/mdreader-safe-html.js' /tmp/apk-list.txt
          grep -q 'assets/js/mdreader-code-fence.js' /tmp/apk-list.txt
          grep -q 'assets/reader.html' /tmp/apk-list.txt
          unzip -l dist/MD-Reader-v0.12.0-release-unsigned.aab > /tmp/aab-list.txt
          grep -q 'base/lib/arm64-v8a/libtranslate_jni.so' /tmp/aab-list.txt
          grep -q 'base/lib/armeabi-v7a/libtranslate_jni.so' /tmp/aab-list.txt
          mkdir -p dist/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" dist/signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/signing-tools/lib/apksigner.jar
          chmod +x dist/signing-tools/apksigner
          sha256sum dist/*.apk dist/*.aab > dist/SHA256SUMS.txt
          {
            echo "version=0.12.0"
            echo "versionCode=14"
            echo "arm64_apk_bytes=$(stat -c%s dist/MD-Reader-v0.12.0-arm64-release-unsigned.apk)"
            echo "aab_bytes=$(stat -c%s dist/MD-Reader-v0.12.0-release-unsigned.aab)"
            echo "minified=true"
            echo "resources_shrunk=true"
            echo "apk_abi=arm64-v8a"
            echo "safe_html=dompurify+allowlist+csp"
            echo "code_block_titles=true"
            echo "signed=false"
          } > dist/release-info.txt
          cat dist/release-info.txt
          cat dist/SHA256SUMS.txt

      - name: Delete older MD Reader artifacts before upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id,.name] | @tsv' > /tmp/artifacts.tsv
          while IFS=$'\t' read -r id name; do
            [ -z "${id:-}" ] && continue
            case "$name" in
              MD-Reader-*)
                echo "Deleting previous artifact: $name ($id)"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
                ;;
            esac
          done < /tmp/artifacts.tsv

      - name: Upload current ARM64 test package
        id: upload_release
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reader-v0.12.0-arm64-unsigned
          path: |
            dist/MD-Reader-v0.12.0-arm64-release-unsigned.apk
            dist/SHA256SUMS.txt
            dist/release-info.txt
            dist/signing-tools/apksigner
            dist/signing-tools/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Report artifact quota without failing validated build
        if: steps.upload_release.outcome == 'failure'
        shell: bash
        run: |
          echo '::warning::APK/AAB build and verification succeeded, but GitHub Actions artifact storage quota prevented artifact upload. Artifact upload is not treated as a code/build failure.'
