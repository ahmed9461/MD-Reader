name: Build MD Reader APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          cat .ci/source.b64.part* | base64 --decode > /tmp/mdreader-source.zip
          unzip -q /tmp/mdreader-source.zip -d source
          test -f source/app/build.gradle
          test -f source/app/src/main/java/app/mdreader/mobile/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Fetch pinned renderer assets
        working-directory: source
        run: bash tools/fetch-vendor-assets.sh

      - name: Run editor smoke tests
        working-directory: source
        run: |
          mkdir -p build/smoke
          javac -d build/smoke \
            app/src/main/java/app/mdreader/mobile/MarkdownTransforms.java \
            app/src/main/java/app/mdreader/mobile/OutlineParser.java \
            tools/TransformSmokeTest.java
          java -cp build/smoke TransformSmokeTest

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          sha256sum source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reader-v0.1.0-debug
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
