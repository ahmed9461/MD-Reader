name: Build MD Reader APK

on:
  workflow_dispatch:
  push:
    branches: [main, v0.2-dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and reconstruct MainActivity source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mainparts.sha256 <<'EOF'
          aefb514e89918ba107575ae5428a02f4735589a724c5ad4970efff90ba3b34e9  .src-parts/MainActivity.java.b64.00
          4334ff28998ffbfcaf6851cde62a692208d0962a1d7e3a7a95a18c6a83df4a76  .src-parts/MainActivity.java.b64.01
          fd0a79f1f0e83d9e657fab3aa014379c1f8e2a3a69d6327e42dd98df70ba1492  .src-parts/MainActivity.java.b64.02
          2c8e2f0a5db70e00abf0e8adf5e750ee10b45f3655bf7e5f990e558d2fecd530  .src-parts/MainActivity.java.b64.03
          5c793d85ff71230e8edf236c49ab3f28fd3b0bae8a0b6899186ee64fb1513cf2  .src-parts/MainActivity.java.b64.04
          ddf82d459a49623f1c666f55696e6d46f67245ce6c1a2cd256585e28a92dbe09  .src-parts/MainActivity.java.b64.05
          ca2517d7a1a262fae550d5911cd4e990ba4f006f4f74f2916125095c38c2ae20  .src-parts/MainActivity.java.b64.06
          460840826d47cbeee80f8a75b4cd341460840143a10c6cfc9a17bfa6af3ac8d6  .src-parts/MainActivity.java.b64.07
          3ecb43e2d2b097938f18e2976255baa0f1e9ecf49933bb4d04724e885a514510  .src-parts/MainActivity.java.b64.08
          EOF
          sha256sum --check --strict /tmp/mainparts.sha256
          mkdir -p app/src/main/java/app/mdreader/mobile
          cat .src-parts/MainActivity.java.b64.* | base64 --decode > app/src/main/java/app/mdreader/mobile/MainActivity.java
          test -s app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q "public class MainActivity" app/src/main/java/app/mdreader/mobile/MainActivity.java
          echo "d735a3a814e3272f0ba9e6e9cb8262c5337754204ee5233365d35566dc468e97  app/src/main/java/app/mdreader/mobile/MainActivity.java" | sha256sum --check --strict

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Fetch pinned Markdown renderer assets
        run: bash tools/fetch-vendor-assets.sh

      - name: Run pure Java smoke tests
        run: |
          mkdir -p build/smoke
          javac -d build/smoke \
            app/src/main/java/app/mdreader/mobile/MarkdownTransforms.java \
            app/src/main/java/app/mdreader/mobile/OutlineParser.java \
            app/src/main/java/app/mdreader/mobile/MarkdownTranslationPlan.java \
            tools/TransformSmokeTest.java \
            tools/TranslationPlanSmokeTest.java
          java -cp build/smoke TransformSmokeTest
          java -cp build/smoke app.mdreader.mobile.TranslationPlanSmokeTest

      - name: Check reader JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/assets/reader.html').read_text()
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/reader-inline.js').write_text(s[start:end])
          PY
          node --check /tmp/reader-inline.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reader-v0.2.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
