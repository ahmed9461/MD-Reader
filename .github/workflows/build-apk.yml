name: Build MD Reader APK

on:
  workflow_dispatch:
  push:
    branches: [main, v0.3-dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify v0.3.1 MainActivity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/app/mdreader/mobile
          cat .src-v03/MainActivity.java.gz.b64.* | base64 --decode | gzip -dc > app/src/main/java/app/mdreader/mobile/MainActivity.java
          test -s app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'public class MainActivity' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'p.setVisibility(View.INVISIBLE)' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'w.setWindowAnimations(0)' app/src/main/java/app/mdreader/mobile/MainActivity.java
          ! grep -q 'p.setTranslationY(getResources().getDisplayMetrics().heightPixels)' app/src/main/java/app/mdreader/mobile/MainActivity.java
          echo '051a55078d3dbecaca37628bb1a8eca0bf5cd305c1fb7472041e1eba2bd331bd  app/src/main/java/app/mdreader/mobile/MainActivity.java' | sha256sum --check --strict
          grep -q '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml
          grep -q '@drawable/ic_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          test -s app/src/main/res/drawable/ic_launcher_monochrome.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Fetch pinned Markdown renderer assets
        run: bash tools/fetch-vendor-assets.sh

      - name: Run pure Java smoke tests
        run: |
          mkdir -p build/smoke
          javac -d build/smoke \
            app/src/main/java/app/mdreader/mobile/MarkdownTransforms.java \
            app/src/main/java/app/mdreader/mobile/OutlineParser.java \
            app/src/main/java/app/mdreader/mobile/MarkdownTranslationPlan.java \
            tools/TransformSmokeTest.java \
            tools/TranslationPlanSmokeTest.java
          java -cp build/smoke TransformSmokeTest
          java -cp build/smoke app.mdreader.mobile.TranslationPlanSmokeTest

      - name: Check reader JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/assets/reader.html').read_text()
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/reader-inline.js').write_text(s[start:end])
          PY
          node --check /tmp/reader-inline.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml' /tmp/apk-list.txt
          grep -q 'res/mipmap-anydpi-v33/ic_launcher.xml' /tmp/apk-list.txt
          grep -q 'res/drawable/ic_launcher_foreground.xml' /tmp/apk-list.txt
          grep -q 'res/drawable/ic_launcher_monochrome.xml' /tmp/apk-list.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reader-v0.3.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
