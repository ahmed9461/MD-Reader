name: Build MD Reader APK

on:
  workflow_dispatch:
  push:
    branches: [main, v0.4-dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch v0.4 MainActivity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v03parts.sha256 <<'EOF'
          a3f1d797de1e0a352196b0438d8402a812d22e4b57b8d22b5b31a121be1f807e  .src-v03/MainActivity.java.gz.b64.00
          1d0787fa2558b582e432748be52636e736b54103e6f710484410e1447f9ee176  .src-v03/MainActivity.java.gz.b64.01
          055d8088fea7bcbb1683ecc8eaf227ee47a5bcff5a04b44e2279a880eb10777f  .src-v03/MainActivity.java.gz.b64.02
          db0adc95689cbb6d2caa3b523e204189ff2ee0f3092f5c0fc5fafed8b9b2442a  .src-v03/MainActivity.java.gz.b64.03
          EOF
          sha256sum --check --strict /tmp/v03parts.sha256
          mkdir -p app/src/main/java/app/mdreader/mobile
          cat .src-v03/MainActivity.java.gz.b64.* | base64 --decode | gzip -dc > app/src/main/java/app/mdreader/mobile/MainActivity.java
          echo 'ca2b495d74e56663a815641e793c750d29643f612a2ea50fc2164ddec52ca04f  app/src/main/java/app/mdreader/mobile/MainActivity.java' | sha256sum --check --strict
          patch -p1 < .ci/v0.3.1-bottom-sheet.patch
          echo '051a55078d3dbecaca37628bb1a8eca0bf5cd305c1fb7472041e1eba2bd331bd  app/src/main/java/app/mdreader/mobile/MainActivity.java' | sha256sum --check --strict
          patch -p1 < .ci/v0.4-mainactivity.patch
          sha256sum app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'DeepSeek' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'secrets.hasKey(provider)' app/src/main/java/app/mdreader/mobile/MainActivity.java
          grep -q 'PROVIDER_DEEPSEEK' app/src/main/java/app/mdreader/mobile/AiTranslationService.java
          grep -q 'chat/completions' app/src/main/java/app/mdreader/mobile/AiTranslationService.java
          grep -q 'thinking' app/src/main/java/app/mdreader/mobile/AiTranslationService.java
          grep -q 'PROVIDER_DEEPSEEK' app/src/main/java/app/mdreader/mobile/ApiKeyStore.java
          grep -q '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml
          grep -q '#102B57' app/src/main/res/drawable/ic_launcher_background.xml
          grep -q 'simplified m' app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Fetch pinned Markdown renderer assets
        run: bash tools/fetch-vendor-assets.sh

      - name: Run pure Java smoke tests
        run: |
          mkdir -p build/smoke
          javac -d build/smoke \
            app/src/main/java/app/mdreader/mobile/MarkdownTransforms.java \
            app/src/main/java/app/mdreader/mobile/OutlineParser.java \
            app/src/main/java/app/mdreader/mobile/MarkdownTranslationPlan.java \
            tools/TransformSmokeTest.java \
            tools/TranslationPlanSmokeTest.java
          java -cp build/smoke TransformSmokeTest
          java -cp build/smoke app.mdreader.mobile.TranslationPlanSmokeTest

      - name: Check reader JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/assets/reader.html').read_text()
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/reader-inline.js').write_text(s[start:end])
          PY
          node --check /tmp/reader-inline.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml' /tmp/apk-list.txt
          grep -q 'res/drawable/ic_launcher_foreground.xml' /tmp/apk-list.txt
          grep -q 'res/drawable/ic_launcher_background.xml' /tmp/apk-list.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reader-v0.4.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
