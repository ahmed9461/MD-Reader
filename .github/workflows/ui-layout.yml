name: One-time reviewed landscape layout fix
on:
  push:
    branches: ['feature/ui-ux-refresh']
    paths: ['.github/workflows/ui-layout.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed layout change
        run: |
          echo '84986a54d2356901896f5e10136f5f98a32f0b114e3b279ed3d6f33b44c541f5  app/src/main/java/app/mdreader/mobile/MainActivity.java' | sha256sum -c
          git apply --check .ui-layout.patch
          git apply .ui-layout.patch
          echo '641690650e93939227509a6d79b01c62f3ccb16d5a68948577fbe0afb1e8e04f  app/src/main/java/app/mdreader/mobile/MainActivity.java' | sha256sum -c
          rm .ui-layout.patch
          git diff --check
          python3 tools/ui-contract-check.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/mdreader/mobile/MainActivity.java .ui-layout.patch
          git commit -m 'Keep search and document side by side above a tall landscape keyboard'
          git push origin HEAD:feature/ui-ux-refresh
