name: One-time v0.10 performance polish

on:
  push:
    branches:
      - feature/task-answer-highlights-performance

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task-answer-highlights-performance

      - name: Apply performance migration
        run: python3 tools/perf_polish_v010.py

      - name: Commit direct changes and remove temporary migration files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/perf-polish-v010.yml tools/perf_polish_v010.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/mdreader/mobile/MainActivity.java app/src/main/assets/reader.html
          git commit -m 'Polish v0.10 performance for large Markdown documents'
          git push origin HEAD:feature/task-answer-highlights-performance
