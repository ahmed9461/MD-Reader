          new='    const rawHtml=fm.html+md.render(fm.source);\n    const safeHtml=(window.MDReaderSafeHtml&&typeof window.MDReaderSafeHtml.sanitize===\'function\')?window.MDReaderSafeHtml.sanitize(rawHtml):esc(rawHtml);\n    content.innerHTML=safeHtml;\n'
          if 'window.MDReaderSafeHtml.sanitize(rawHtml)' not in s:
