name: One-time v0.11 safe HTML integration

on:
  push:
    branches:
      - 'feature/safe-html-layer-tools'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/safe-html-layer-tools
          fetch-depth: 0

      - name: Integrate safe HTML layer and editor tools
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/assets/js/mdreader-safe-html.js <<'EOF'
          (function(){
            'use strict';

            const ALLOWED_TAGS = [
              'a','abbr','b','blockquote','br','cite','code','dd','del','details','div','dl','dt','em',
              'figcaption','figure','h1','h2','h3','h4','h5','h6','hr','i','img','ins','kbd','li','mark',
              'ol','p','pre','q','s','small','span','strong','sub','summary','sup','table','tbody','td',
              'tfoot','th','thead','tr','u','ul'
            ];
            const ALLOWED_ATTR = [
              'alt','class','colspan','dir','height','href','open','reversed','rowspan','src','start','style',
              'title','width'
            ];
            const FORBID_TAGS = [
              'script','style','iframe','object','embed','form','input','button','textarea','select','option',
              'meta','link','base','svg','math','video','audio','canvas'
            ];
            const NAMED_COLORS = new Set([
              'black','white','gray','grey','red','green','blue','yellow','orange','purple','pink','brown',
              'cyan','magenta','teal','navy','maroon','olive','lime','aqua','silver','transparent','currentcolor'
            ]);
            const SAFE_STYLE_PROPERTIES = new Set([
              'color','background-color','text-align','font-weight','font-style','text-decoration','font-size','display'
            ]);

            function escapeHtml(value){
              return String(value||'').replace(/[&<>"']/g,function(ch){
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
              });
            }

            function safeColor(value){
              const v=String(value||'').trim().toLowerCase();
              if(/^(?:#[0-9a-f]{3}|#[0-9a-f]{4}|#[0-9a-f]{6}|#[0-9a-f]{8})$/i.test(v))return v;
              if(/^rgba?\(\s*[\d.%\s,]+\)$/i.test(v))return v;
              if(/^hsla?\(\s*[-\d.%\s,]+\)$/i.test(v))return v;
              return NAMED_COLORS.has(v)?v:'';
            }

            function safeFontSize(value){
              const v=String(value||'').trim().toLowerCase();
              const m=v.match(/^(\d+(?:\.\d+)?)(px|em|rem|%)$/);
              if(!m)return '';
              const n=Number(m[1]);
              if(!Number.isFinite(n)||n<=0)return '';
              if(m[2]==='px'&&n>96)return '';
              if((m[2]==='em'||m[2]==='rem')&&n>6)return '';
              if(m[2]==='%'&&n>400)return '';
              return v;
            }

            function safeStyleValue(property,value){
              const v=String(value||'').trim();
              if(!v||/[{}<>]|url\s*\(|expression\s*\(|javascript\s*:/i.test(v))return '';
              switch(property){
                case 'color':
                case 'background-color': return safeColor(v);
                case 'text-align': return /^(left|right|center|justify|start|end)$/i.test(v)?v.toLowerCase():'';
                case 'font-weight': return /^(normal|bold|[1-9]00)$/i.test(v)?v.toLowerCase():'';
                case 'font-style': return /^(normal|italic|oblique)$/i.test(v)?v.toLowerCase():'';
                case 'text-decoration': return /^(?:none|underline|line-through|overline)(?:\s+(?:underline|line-through|overline))*$/i.test(v)?v.toLowerCase():'';
                case 'font-size': return safeFontSize(v);
                case 'display': return /^(block|inline|inline-block)$/i.test(v)?v.toLowerCase():'';
                default: return '';
              }
            }

            function sanitizeStyle(style){
              const out=[];
              String(style||'').split(';').forEach(function(part){
                const idx=part.indexOf(':');
                if(idx<1)return;
                const property=part.slice(0,idx).trim().toLowerCase();
                if(!SAFE_STYLE_PROPERTIES.has(property))return;
                const value=safeStyleValue(property,part.slice(idx+1));
                if(value)out.push(property+':'+value);
              });
              return out.join(';');
            }

            function sanitizeClass(value){
              return String(value||'').split(/\s+/).filter(function(token){
                return /^(?:language|lang)-[a-z0-9_+.-]+$/i.test(token);
              }).join(' ');
            }

            function numericAttribute(value,min,max){
              if(!/^\d+$/.test(String(value||'').trim()))return '';
              const n=Number(value);
              return n>=min&&n<=max?String(n):'';
            }

            function installHooks(){
              if(!window.DOMPurify||window.__mdReaderSafeHtmlHooksInstalled)return;
              window.__mdReaderSafeHtmlHooksInstalled=true;
              DOMPurify.addHook('uponSanitizeAttribute',function(node,data){
                const name=String(data.attrName||'').toLowerCase();
                if(name==='style'){
                  const cleaned=sanitizeStyle(data.attrValue);
                  if(cleaned)data.attrValue=cleaned;else data.keepAttr=false;
                }else if(name==='class'){
                  const cleaned=sanitizeClass(data.attrValue);
                  if(cleaned)data.attrValue=cleaned;else data.keepAttr=false;
                }else if(name==='dir'){
                  if(!/^(rtl|ltr|auto)$/i.test(String(data.attrValue||'')))data.keepAttr=false;
                }else if(name==='width'||name==='height'){
                  const cleaned=numericAttribute(data.attrValue,1,4096);
                  if(cleaned)data.attrValue=cleaned;else data.keepAttr=false;
                }else if(name==='colspan'||name==='rowspan'){
                  const cleaned=numericAttribute(data.attrValue,1,100);
                  if(cleaned)data.attrValue=cleaned;else data.keepAttr=false;
                }else if(name==='start'){
                  if(!/^-?\d{1,6}$/.test(String(data.attrValue||'').trim()))data.keepAttr=false;
                }
              });
            }

            function sanitize(html){
              if(!window.DOMPurify)return escapeHtml(html);
              installHooks();
              return DOMPurify.sanitize(String(html||''),{
                ALLOWED_TAGS:ALLOWED_TAGS,
                ALLOWED_ATTR:ALLOWED_ATTR,
                FORBID_TAGS:FORBID_TAGS,
                ALLOW_ARIA_ATTR:false,
                ALLOW_DATA_ATTR:false,
                ALLOW_UNKNOWN_PROTOCOLS:false,
                KEEP_CONTENT:true,
                RETURN_TRUSTED_TYPE:false
              });
            }

            window.MDReaderSafeHtml={
              sanitize:sanitize,
              sanitizeStyle:sanitizeStyle,
              safeColor:safeColor,
              allowedTags:ALLOWED_TAGS.slice()
            };
          })();
          EOF

          cat > app/src/main/java/app/mdreader/mobile/SafeHtmlEditorTools.java <<'EOF'
          package app.mdreader.mobile;

          /** Pure editor transformations for the safe HTML subset supported by MD Reader. */
          final class SafeHtmlEditorTools {
              private SafeHtmlEditorTools() { }

              static MarkdownTransforms.Result highlight(String text,int start,int end){
                  return wrap(text,start,end,"<mark>","</mark>","نص مميز");
              }
              static MarkdownTransforms.Result underline(String text,int start,int end){
                  return wrap(text,start,end,"<u>","</u>","نص مسطر");
              }
              static MarkdownTransforms.Result superscript(String text,int start,int end){
                  return wrap(text,start,end,"<sup>","</sup>","2");
              }
              static MarkdownTransforms.Result subscript(String text,int start,int end){
                  return wrap(text,start,end,"<sub>","</sub>","2");
              }
              static MarkdownTransforms.Result keyboard(String text,int start,int end){
                  return wrap(text,start,end,"<kbd>","</kbd>","Ctrl+C");
              }
              static MarkdownTransforms.Result small(String text,int start,int end){
                  return wrap(text,start,end,"<small>","</small>","نص صغير");
              }
              static MarkdownTransforms.Result textColor(String text,int start,int end,String color){
                  String safe=requireColor(color);
                  return wrap(text,start,end,"<span style=\"color:"+safe+"\">","</span>","نص ملون");
              }
              static MarkdownTransforms.Result backgroundColor(String text,int start,int end,String color){
                  String safe=requireColor(color);
                  return wrap(text,start,end,"<span style=\"background-color:"+safe+"\">","</span>","نص مظلل");
              }
              static MarkdownTransforms.Result alignment(String text,int start,int end,String alignment){
                  String a=alignment==null?"":alignment.trim().toLowerCase();
                  if(!a.matches("left|right|center|justify|start|end"))throw new IllegalArgumentException("Unsupported alignment");
                  return wrap(text,start,end,"<span style=\"display:block;text-align:"+a+"\">","</span>","نص");
              }
              static MarkdownTransforms.Result direction(String text,int start,int end,String direction){
                  String d=direction==null?"":direction.trim().toLowerCase();
                  if(!d.matches("rtl|ltr|auto"))throw new IllegalArgumentException("Unsupported direction");
                  return wrap(text,start,end,"<span dir=\""+d+"\">","</span>","نص");
              }
              static MarkdownTransforms.Result details(String text,int start,int end){
                  return MarkdownTransforms.wrap(text,start,end,"<details>\n<summary>التفاصيل</summary>\n","\n</details>","المحتوى");
              }
              static MarkdownTransforms.Result lineBreak(String text,int start,int end){
                  return MarkdownTransforms.insert(text,start,end,"<br>");
              }
              static boolean isSafeColor(String color){return normalizeColor(color)!=null;}

              private static MarkdownTransforms.Result wrap(String text,int start,int end,String before,String after,String placeholder){
                  return MarkdownTransforms.wrap(text,start,end,before,after,placeholder);
              }
              private static String requireColor(String color){
                  String value=normalizeColor(color);
                  if(value==null)throw new IllegalArgumentException("Unsupported color");
                  return value;
              }
              private static String normalizeColor(String color){
                  if(color==null)return null;
                  String v=color.trim();
                  if(v.matches("(?i)^(#[0-9a-f]{3}|#[0-9a-f]{4}|#[0-9a-f]{6}|#[0-9a-f]{8})$"))return v.toUpperCase();
                  String lower=v.toLowerCase();
                  if(lower.matches("black|white|gray|grey|red|green|blue|yellow|orange|purple|pink|brown|cyan|magenta|teal|navy|maroon|olive|lime|aqua|silver|transparent|currentcolor"))return lower;
                  return null;
              }
          }
          EOF

          cat > tools/SafeHtmlEditorToolsSmokeTest.java <<'EOF'
          package app.mdreader.mobile;

          public final class SafeHtmlEditorToolsSmokeTest {
              public static void main(String[] args){
                  eq("<mark>hello</mark>",SafeHtmlEditorTools.highlight("hello",0,5).text,"mark");
                  eq("<u>hello</u>",SafeHtmlEditorTools.underline("hello",0,5).text,"underline");
                  eq("<span style=\"color:#0969DA\">hello</span>",SafeHtmlEditorTools.textColor("hello",0,5,"#0969da").text,"color");
                  eq("<span style=\"background-color:#FFF8C5\">hello</span>",SafeHtmlEditorTools.backgroundColor("hello",0,5,"#fff8c5").text,"background");
                  eq("<span style=\"display:block;text-align:center\">hello</span>",SafeHtmlEditorTools.alignment("hello",0,5,"center").text,"alignment");
                  eq("<span dir=\"rtl\">hello</span>",SafeHtmlEditorTools.direction("hello",0,5,"rtl").text,"direction");
                  if(!SafeHtmlEditorTools.isSafeColor("#ABC"))fail("short hex should be valid");
                  if(SafeHtmlEditorTools.isSafeColor("url(javascript:1)"))fail("unsafe color accepted");
                  boolean threw=false;try{SafeHtmlEditorTools.textColor("x",0,1,"expression(alert(1))");}catch(IllegalArgumentException expected){threw=true;}
                  if(!threw)fail("invalid color must fail closed");
                  if(!SafeHtmlEditorTools.details("body",0,4).text.contains("<summary>التفاصيل</summary>"))fail("details template");
                  eq("<br>",SafeHtmlEditorTools.lineBreak("",0,0).text,"br");
                  System.out.println("SafeHtmlEditorToolsSmokeTest OK");
              }
              private static void eq(String expected,String actual,String label){if(!expected.equals(actual))fail(label+" expected="+expected+" actual="+actual);}
              private static void fail(String message){throw new AssertionError(message);}
          }
