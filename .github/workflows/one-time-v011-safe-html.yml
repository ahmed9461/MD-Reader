          from pathlib import Path

          def replace_once(path,old,new,label):
              p=Path(path);s=p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'Expected source block not found: {label}')
              p.write_text(s.replace(old,new,1))

          # Version bump.
          replace_once('app/build.gradle',"        versionCode 13\n        versionName '0.10.0'","        versionCode 14\n        versionName '0.11.0'",'version bump')

          # Vendor DOMPurify locally at build time; runtime remains offline/local.
          vendor=Path('tools/fetch-vendor-assets.sh')
          s=vendor.read_text()
          marker='fetch "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js" "$DEST/highlight.min.js"\n'
          addition=marker+'fetch "https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" "$DEST/purify.min.js"\n'
          if 'dompurify@3.2.6' not in s:
              if marker not in s: raise SystemExit('Vendor insertion marker missing')
              vendor.write_text(s.replace(marker,addition,1))

