          main=Path('app/src/main/java/app/mdreader/mobile/MainActivity.java')
          s=main.read_text()
          old='format("رابط",v->apply(MarkdownTransforms.link(txt(),editor.getSelectionStart(),editor.getSelectionEnd(),false)));format("صورة",v->apply(MarkdownTransforms.link(txt(),editor.getSelectionStart(),editor.getSelectionEnd(),true)));format("جدول",v->insert("\\n| العمود 1 | العمود 2 |\\n| --- | --- |\\n| قيمة 1 | قيمة 2 |\\n"));format("—",v->insert("\\n---\\n"));divider();format("ترجمة",v->translationMenu());'
          new='format("رابط",v->apply(MarkdownTransforms.link(txt(),editor.getSelectionStart(),editor.getSelectionEnd(),false)));format("صورة",v->apply(MarkdownTransforms.link(txt(),editor.getSelectionStart(),editor.getSelectionEnd(),true)));format("جدول",v->insert("\\n| العمود 1 | العمود 2 |\\n| --- | --- |\\n| قيمة 1 | قيمة 2 |\\n"));format("—",v->insert("\\n---\\n"));format("HTML",v->safeHtmlTools());divider();format("ترجمة",v->translationMenu());'
