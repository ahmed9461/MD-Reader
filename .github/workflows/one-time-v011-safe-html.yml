name: One-time v0.11 safe HTML integration

on:
  push:
    branches:
      - 'feature/safe-html-layer-tools'

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/safe-html-layer-tools
          fetch-depth: 0

      - name: Apply direct-source v0.11 changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/one_time_v011_integrate.py
          git rm tools/one_time_v011_integrate.py
          git rm .github/workflows/one-time-v011-safe-html.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tools PROJECT_MEMORY.md .github/workflows/build-apk.yml
          git commit -m 'Add safe HTML rendering layer and editor tools'
          git push origin HEAD:feature/safe-html-layer-tools
