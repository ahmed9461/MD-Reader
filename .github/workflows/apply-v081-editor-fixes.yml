name: Apply v0.8.1 editor fixes

on:
  push:
    branches:
      - v0.8-work
    paths:
      - '.github/workflows/apply-v081-editor-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v0.8-work

      - name: Apply source update
        run: python3 tools/apply_v081_editor_fixes.py

      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/mdreader/mobile/MainActivity.java
          git diff --cached --check
          git commit -m "Fix editor fling and sheet usability for v0.8.1"
          git push origin HEAD:v0.8-work
