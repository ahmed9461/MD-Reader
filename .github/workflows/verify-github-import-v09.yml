name: Verify GitHub import v0.9

on:
  push:
    branches: [github-import-v0.9]
    paths:
      - '.github/workflows/verify-github-import-v09.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: github-import-v0.9

      - name: Apply deterministic source transformation
        run: python3 tools/apply_github_import_v09.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle without Actions cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Fetch pinned renderer assets
        run: bash tools/fetch-vendor-assets.sh

      - name: Run Java smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/smoke
          javac -d build/smoke \
            app/src/main/java/app/mdreader/mobile/MarkdownTransforms.java \
            app/src/main/java/app/mdreader/mobile/OutlineParser.java \
            app/src/main/java/app/mdreader/mobile/MarkdownTranslationPlan.java \
            app/src/main/java/app/mdreader/mobile/MarkdownSpeechPlan.java \
            app/src/main/java/app/mdreader/mobile/SearchReplaceEngine.java \
            app/src/main/java/app/mdreader/mobile/GitHubMarkdownSource.java \
            tools/TransformSmokeTest.java \
            tools/TranslationPlanSmokeTest.java \
            tools/SpeechPlanSmokeTest.java \
            tools/SearchReplaceSmokeTest.java \
            tools/GitHubMarkdownSourceSmokeTest.java
          java -cp build/smoke TransformSmokeTest
          java -cp build/smoke app.mdreader.mobile.TranslationPlanSmokeTest
          java -cp build/smoke app.mdreader.mobile.SpeechPlanSmokeTest
          java -cp build/smoke app.mdreader.mobile.SearchReplaceSmokeTest
          java -cp build/smoke app.mdreader.mobile.GitHubMarkdownSourceSmokeTest

      - name: Compile Android debug variant
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/mdreader/mobile/MainActivity.java \
                  app/src/main/java/app/mdreader/mobile/GitHubMarkdownSource.java \
                  tools/GitHubMarkdownSourceSmokeTest.java \
                  app/build.gradle .github/workflows/build-apk.yml PROJECT_MEMORY.md
          git diff --cached --check
          git commit -m "Add direct GitHub Markdown downloads (v0.9.0)"
          git push origin HEAD:github-import-v0.9
